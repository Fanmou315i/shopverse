spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopverse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: shopverse
    password: shopverse
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1700000
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 10
      batch-size: 32768
      linger-ms: 10

commerce:
  kafka:
    enabled: true
  outbox:
    poll-interval-ms: 250

shopverse:
  redis:
    enabled: true
